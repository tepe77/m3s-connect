services:
  postgres:
    image: postgres:16-alpine
    container_name: m3s-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-m3s_connect}
      POSTGRES_USER: ${DB_USERNAME:-m3s_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-m3s_password}
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-m3s_user} -d ${DB_DATABASE:-m3s_connect}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - m3s-network

  redis:
    image: redis:7-alpine
    container_name: m3s-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - m3s-network

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: m3s-backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - m3s-network

  nginx:
    image: nginx:alpine
    container_name: m3s-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORWARD_NGINX_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - m3s-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  m3s-network:
    driver: bridge
